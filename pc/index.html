<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHIRIMEN サーボロック制御</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">CHIRIMEN Remote Lock</p>
        <h1>サーボロック制御</h1>
        <p id="connectionStatus" class="status status-wait">接続中...</p>
      </header>

      <section class="panel lock-panel" aria-labelledby="lockHeading">
        <h2 id="lockHeading">ロック状態</h2>
        <p id="lockState" class="lock-badge lock-on">LOCK</p>
        <p class="hint">解除中だけボタン / 照度でサーボが動きます</p>
        <div class="actions">
          <button id="unlockButton" type="button">解除</button>
          <button id="lockButton" type="button" class="secondary">ロック</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="servoHeading">
        <h2 id="servoHeading">サーボ操作</h2>
        <p class="hint">スマホから直接動かします。ロック中でも操作できます</p>
        <div class="actions actions-single">
          <button id="servoRunButton" type="button">サーボを動かす</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="deviceHeading">
        <h2 id="deviceHeading">デバイス状態</h2>
        <dl class="stats">
          <div>
            <dt>センサー</dt>
            <dd id="sensorState">-</dd>
          </div>
          <div>
            <dt>照度</dt>
            <dd id="luxState">-</dd>
          </div>
          <div>
            <dt>サーボ</dt>
            <dd id="servoState">-</dd>
          </div>
        </dl>
      </section>

      <p id="messageDiv" class="message">リレーサービスに接続しています</p>
    </main>
    <script type="module" src="./pc.js?v=2"></script>
  </body>
</html>
